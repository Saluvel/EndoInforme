[package]
name = "endoinforme"
version = "1.2.16"
description = "EndoInforme: informes endoscópicos en clics"
authors = ["Luis Vélez Vizcaíno - SALUVEL SpA"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
opt-level = "s"
